version: 0.2

env:
  variables:
    CDK_DEFAULT_REGION: "ap-northeast-1"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      # shogi-board (ライブラリ) の依存インストール
      - npm ci --prefix shogi-board
      # shogi-main (アプリ) の依存インストール
      # file:../shogi-board のシンボリックリンクを正しく解決するため npm install を使用
      - npm install --prefix shogi-main

  pre_build:
    commands:
      # CDK エクスポートからデプロイ先情報を取得
      - |
        S3_BUCKET=$(aws cloudformation list-exports \
          --region ${CDK_DEFAULT_REGION} \
          --query "Exports[?Name=='${PROJECT}-${ENV}-infra-S3BucketName'].Value" \
          --output text)
        DISTRIBUTION_ID=$(aws cloudformation list-exports \
          --region ${CDK_DEFAULT_REGION} \
          --query "Exports[?Name=='${PROJECT}-${ENV}-infra-CloudFrontDistributionId'].Value" \
          --output text)
        CF_DOMAIN=$(aws cloudformation list-exports \
          --region ${CDK_DEFAULT_REGION} \
          --query "Exports[?Name=='${PROJECT}-${ENV}-infra-CloudFrontDomainName'].Value" \
          --output text)
        COGNITO_CLIENT_ID=$(aws cloudformation list-exports \
          --region ${CDK_DEFAULT_REGION} \
          --query "Exports[?Name=='${PROJECT}-${ENV}-infra-CognitoClientId'].Value" \
          --output text)
        COGNITO_DOMAIN=$(aws cloudformation list-exports \
          --region ${CDK_DEFAULT_REGION} \
          --query "Exports[?Name=='${PROJECT}-${ENV}-infra-CognitoDomain'].Value" \
          --output text)
        COGNITO_USER_POOL_ID=$(aws cloudformation list-exports \
          --region ${CDK_DEFAULT_REGION} \
          --query "Exports[?Name=='${PROJECT}-${ENV}-infra-CognitoUserPoolId'].Value" \
          --output text)
      - echo "S3_BUCKET=${S3_BUCKET}"
      - echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
      # Vite 環境変数を設定
      - export VITE_COGNITO_AUTHORITY="https://cognito-idp.${CDK_DEFAULT_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}"
      - export VITE_COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}"
      - export VITE_COGNITO_DOMAIN="${COGNITO_DOMAIN}"
      - export VITE_REDIRECT_URI="https://${CF_DOMAIN}/callback"
      - export VITE_API_BASE_URL="/api/v1"

  build:
    commands:
      - npm run build --prefix shogi-main

  post_build:
    commands:
      # S3 にデプロイ
      - aws s3 sync shogi-main/dist "s3://${S3_BUCKET}" --delete --region ${CDK_DEFAULT_REGION}
      # CloudFront キャッシュ無効化
      - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
      - echo "Frontend deployment completed."
